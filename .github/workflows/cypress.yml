name: Automation-Delta-Children Workflow

on:
  # Ejecutar diariamente a las 00:30 UTC (medianoche en muchas zonas horarias)
  schedule:
    - cron: '30 0 * * *'
  # También ejecutar manualmente desde GitHub Actions
  workflow_dispatch:
  # Ejecutar en push a la rama principal
  push:
    branches:
      - Automation-Delta
      - main
      - master

jobs:
  cypress:
    runs-on: ubuntu-latest
    # Sin matriz cuando no hay recording para evitar ejecuciones duplicadas
    strategy:
      fail-fast: false
      matrix:
        containers: [1] # Un solo contenedor (sin paralelización sin recording)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install report dependencies
        run: |
          npm install --save-dev mochawesome mochawesome-merge mochawesome-report-generator
      
      - name: Check if recording is enabled
        id: check-recording
        run: |
          if [ -z "${{ secrets.CYPRESS_RECORD_KEY }}" ]; then
            echo "recording_enabled=false" >> $GITHUB_OUTPUT
          else
            echo "recording_enabled=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Cypress run (without recording)
        id: cypress-run-no-recording
        if: steps.check-recording.outputs.recording_enabled == 'false'
        uses: cypress-io/github-action@v6
        continue-on-error: true
        with:
          wait-on: 'https://www.deltachildren.com/'
          wait-on-timeout: 120
          browser: chrome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cypress run (with recording)
        id: cypress-run-recording
        if: steps.check-recording.outputs.recording_enabled == 'true'
        uses: cypress-io/github-action@v6
        continue-on-error: true
        with:
          wait-on: 'https://www.deltachildren.com/'
          wait-on-timeout: 120
          browser: chrome
          record: true
          parallel: true
          group: 'Delta Children Tests'
          ci-build-id: ${{ github.run_id }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set Cypress result
        id: cypress-result
        if: always()
        run: |
          # Check which step ran and get its outcome
          if [ "${{ steps.check-recording.outputs.recording_enabled }}" == "false" ]; then
            CYPRESS_OUTCOME="${{ steps.cypress-run-no-recording.outcome }}"
          else
            CYPRESS_OUTCOME="${{ steps.cypress-run-recording.outcome }}"
          fi
          
          if [ "$CYPRESS_OUTCOME" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "result=PASSED" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "result=FAILED" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: Cypress/screenshots
          retention-days: 7
      
      - name: Upload accessibility reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-reports
          path: Cypress/accessibility/**
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: Cypress/videos
          retention-days: 7
      
      - name: Generate HTML test report
        if: always()
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          node scripts/generate-report.js || echo "Report generation failed, but continuing..."
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: Cypress/reports/merged/test-report.html
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: Cypress/reports/merged/test-summary.md
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Send detailed Slack report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          CYPRESS_RESULT: ${{ steps.cypress-result.outputs.result }}
          CYPRESS_STATUS: ${{ steps.cypress-result.outputs.status }}
        run: |
          node scripts/slack-notifier.js || echo "Slack notification failed, but continuing..."









          















