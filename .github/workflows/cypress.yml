name: Automation-Delta-Children Workflow

on:
  # Ejecutar diariamente a las 00:30 UTC (medianoche en muchas zonas horarias)
  schedule:
    - cron: '30 0 * * *'
  # También ejecutar manualmente desde GitHub Actions
  workflow_dispatch:
  # Ejecutar en push a la rama principal
  push:
    branches:
      - Automation-Delta
      - main
      - master

jobs:
  cypress:
    runs-on: ubuntu-latest
    # Sin matriz cuando no hay recording para evitar ejecuciones duplicadas
    strategy:
      fail-fast: false
      matrix:
        containers: [1] # Un solo contenedor (sin paralelización sin recording)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No usar cache para evitar conflictos con --legacy-peer-deps
          cache: ''
      
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          echo "📋 Node version: $(node --version)"
          echo "📋 npm version: $(npm --version)"
          echo "📋 Checking package files..."
          ls -la package.json package-lock.json || echo "⚠️ Some package files missing"
          
          # Clean install to avoid conflicts
          echo "🧹 Cleaning node_modules and package-lock if needed..."
          rm -rf node_modules
          
          echo "🔄 Installing dependencies with npm install (using --legacy-peer-deps for compatibility)..."
          npm install --legacy-peer-deps --no-audit --no-fund
          
          if [ $? -ne 0 ]; then
            echo "❌ npm install failed"
            echo "📋 Attempting to see what went wrong..."
            npm install --legacy-peer-deps --no-audit --no-fund --verbose 2>&1 | tail -50
            exit 1
          fi
          
          echo "✅ Dependencies installed successfully"
          
          # Verify critical dependencies are installed
          echo "🔍 Verifying critical dependencies..."
          MISSING_DEPS=0
          
          if [ ! -d "node_modules/cypress" ]; then
            echo "❌ Cypress not found in node_modules"
            MISSING_DEPS=1
          else
            echo "✅ Cypress found: $(node_modules/.bin/cypress --version 2>/dev/null || echo 'version check failed')"
          fi
          
          if [ ! -d "node_modules/mochawesome" ]; then
            echo "❌ mochawesome not found"
            MISSING_DEPS=1
          else
            echo "✅ mochawesome found"
          fi
          
          if [ ! -d "node_modules/mochawesome-merge" ]; then
            echo "❌ mochawesome-merge not found"
            MISSING_DEPS=1
          else
            echo "✅ mochawesome-merge found"
          fi
          
          if [ $MISSING_DEPS -eq 1 ]; then
            echo "❌ Some critical dependencies are missing"
            echo "📋 Listing node_modules contents..."
            ls -la node_modules/ | head -20
            exit 1
          fi
          
          echo "✅ All critical dependencies verified"
      
      - name: Check if recording is enabled
        id: check-recording
        run: |
          if [ -z "${{ secrets.CYPRESS_RECORD_KEY }}" ]; then
            echo "recording_enabled=false" >> $GITHUB_OUTPUT
          else
            echo "recording_enabled=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Wait for site to be ready
        if: steps.check-recording.outputs.recording_enabled == 'false'
        run: |
          echo "⏳ Waiting for site to be ready..."
          timeout=120
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f -s https://www.deltachildren.com/ > /dev/null 2>&1; then
              echo "✅ Site is ready!"
              exit 0
            fi
            echo "⏳ Waiting... ($elapsed/$timeout seconds)"
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "⚠️ Site did not become ready within $timeout seconds, but continuing..."
      
      - name: Cypress run (without recording)
        id: cypress-run-no-recording
        if: steps.check-recording.outputs.recording_enabled == 'false'
        run: |
          echo "🚀 Running Cypress tests..."
          echo "📋 Cypress version: $(npx cypress --version || echo 'version check failed')"
          echo "📋 Current directory: $(pwd)"
          echo "📋 Checking cypress.config.js exists:"
          ls -la cypress.config.js || echo "⚠️ cypress.config.js not found"
          
          # Asegurar que el directorio de reportes existe
          mkdir -p Cypress/reports
          echo "📁 Created/verified Cypress/reports directory"
          
          # Verificar configuración de reporter
          echo "📋 Checking mochawesome configuration:"
          node -e "const config = require('./cypress.config.js'); console.log('Reporter:', config.e2e?.reporter); console.log('ReportDir:', config.e2e?.reporterOptions?.reportDir);"
          
          # Ejecutar Cypress directamente para asegurar que use la configuración correcta
          echo "▶️ Starting Cypress execution..."
          npx cypress run --browser chrome --config-file cypress.config.js || CYPRESS_EXIT=$?
          
          echo "📊 Cypress execution completed with exit code: ${CYPRESS_EXIT:-0}"
          
          # Verificar reportes inmediatamente después
          echo "🔍 Checking for reports after execution:"
          echo "📂 Cypress/reports contents:"
          ls -la Cypress/reports/ 2>/dev/null || echo "Directory is empty or doesn't exist"
          echo "📊 JSON files in Cypress/reports:"
          find Cypress/reports -name "*.json" -type f 2>/dev/null || echo "No JSON files found"
          echo "📊 Mochawesome files anywhere:"
          find . -name "*mochawesome*.json" -type f 2>/dev/null | head -10 || echo "No mochawesome files found"
          
          # No fallar si Cypress falla, pero registrar el resultado
          if [ -n "$CYPRESS_EXIT" ] && [ "$CYPRESS_EXIT" -ne 0 ]; then
            echo "cypress_exit_code=$CYPRESS_EXIT" >> $GITHUB_OUTPUT
            echo "cypress_outcome=failure" >> $GITHUB_OUTPUT
          else
            echo "cypress_exit_code=0" >> $GITHUB_OUTPUT
            echo "cypress_outcome=success" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cypress run (with recording)
        id: cypress-run-recording
        if: steps.check-recording.outputs.recording_enabled == 'true'
        run: |
          echo "🚀 Running Cypress tests with recording..."
          echo "📋 Cypress version: $(npx cypress --version || echo 'version check failed')"
          
          # Asegurar que el directorio de reportes existe
          mkdir -p Cypress/reports
          
          # Ejecutar Cypress con recording
          npx cypress run \
            --browser chrome \
            --config-file cypress.config.js \
            --record \
            --parallel \
            --group "Delta Children Tests" \
            --ci-build-id ${{ github.run_id }} || CYPRESS_EXIT=$?
          
          echo "📊 Cypress execution completed with exit code: ${CYPRESS_EXIT:-0}"
          
          # Verificar reportes inmediatamente después
          echo "🔍 Checking for reports after execution:"
          find Cypress/reports -name "*.json" -type f 2>/dev/null || echo "No JSON files found"
          
          # No fallar si Cypress falla, pero registrar el resultado
          if [ -n "$CYPRESS_EXIT" ] && [ "$CYPRESS_EXIT" -ne 0 ]; then
            echo "cypress_exit_code=$CYPRESS_EXIT" >> $GITHUB_OUTPUT
            echo "cypress_outcome=failure" >> $GITHUB_OUTPUT
          else
            echo "cypress_exit_code=0" >> $GITHUB_OUTPUT
            echo "cypress_outcome=success" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify Cypress execution and reports
        if: always()
        run: |
          echo "🔍 Verifying Cypress execution..."
          
          # Check which step ran
          if [ "${{ steps.check-recording.outputs.recording_enabled }}" == "false" ]; then
            CYPRESS_OUTCOME="${{ steps.cypress-run-no-recording.outcome }}"
            echo "📋 Cypress run (without recording) outcome: $CYPRESS_OUTCOME"
          else
            CYPRESS_OUTCOME="${{ steps.cypress-run-recording.outcome }}"
            echo "📋 Cypress run (with recording) outcome: $CYPRESS_OUTCOME"
          fi
          
          echo "📁 Checking for report files immediately after Cypress run..."
          echo "📂 Current directory: $(pwd)"
          echo "📂 Listing root directory:"
          ls -la | head -20
          
          echo "📂 Checking Cypress directory:"
          if [ -d "Cypress" ]; then
            ls -la Cypress/ | head -20
          else
            echo "⚠️ Cypress directory not found"
          fi
          
          echo "📂 Checking Cypress/reports directory:"
          if [ -d "Cypress/reports" ]; then
            echo "✅ Cypress/reports exists"
            find Cypress/reports -type f | head -20
            echo "📊 JSON files in reports:"
            find Cypress/reports -name "*.json" -type f
            echo "📊 Total JSON files: $(find Cypress/reports -name "*.json" -type f 2>/dev/null | wc -l)"
          else
            echo "⚠️ Cypress/reports directory does not exist"
            echo "📂 Creating directory structure..."
            mkdir -p Cypress/reports
          fi
          
          # Check for any mochawesome files anywhere
          echo "🔍 Searching for mochawesome files in entire workspace:"
          find . -name "*mochawesome*" -type f 2>/dev/null | head -20 || echo "No mochawesome files found"
          
          # Check for Cypress results in default location
          echo "🔍 Checking for Cypress results in default locations:"
          if [ -d "cypress/results" ]; then
            echo "✅ Found cypress/results"
            ls -la cypress/results/
          fi
          if [ -d "cypress/reports" ]; then
            echo "✅ Found cypress/reports"
            ls -la cypress/reports/
          fi
      
      - name: Set Cypress result
        id: cypress-result
        if: always()
        run: |
          # Check which step ran and get its outcome
          if [ "${{ steps.check-recording.outputs.recording_enabled }}" == "false" ]; then
            CYPRESS_OUTCOME="${{ steps.cypress-run-no-recording.outputs.cypress_outcome }}"
            CYPRESS_EXIT="${{ steps.cypress-run-no-recording.outputs.cypress_exit_code }}"
          else
            CYPRESS_OUTCOME="${{ steps.cypress-run-recording.outputs.cypress_outcome }}"
            CYPRESS_EXIT="${{ steps.cypress-run-recording.outputs.cypress_exit_code }}"
          fi
          
          echo "📋 Cypress outcome: $CYPRESS_OUTCOME"
          echo "📋 Cypress exit code: $CYPRESS_EXIT"
          
          if [ "$CYPRESS_OUTCOME" == "success" ] || [ "$CYPRESS_EXIT" == "0" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "result=PASSED" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "result=FAILED" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: Cypress/screenshots
          retention-days: 7
      
      - name: Upload accessibility reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-reports
          path: Cypress/accessibility/**
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: Cypress/videos
          retention-days: 7
      
      - name: Check for report files before generation
        if: always()
        run: |
          echo "🔍 Checking for Cypress report files..."
          echo "📁 Checking Cypress/reports directory..."
          if [ -d "Cypress/reports" ]; then
            echo "✅ Cypress/reports directory exists"
            find Cypress/reports -name "*.json" -type f | head -10
            echo "📊 Total JSON files found: $(find Cypress/reports -name "*.json" -type f | wc -l)"
          else
            echo "⚠️ Cypress/reports directory does not exist"
          fi
          
          echo "📁 Checking for mochawesome files..."
          find . -name "*mochawesome*.json" -type f 2>/dev/null | head -10 || echo "No mochawesome files found"
      
      - name: Generate HTML test report
        if: always()
        id: generate-report
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          echo "📊 Generating test report..."
          echo "📋 Current directory: $(pwd)"
          echo "📋 Node version: $(node --version)"
          
          # Check if report files exist before generating
          REPORT_COUNT=$(find Cypress/reports -name "*mochawesome*.json" -type f 2>/dev/null | wc -l || echo "0")
          echo "📊 Found $REPORT_COUNT report file(s)"
          
          if [ "$REPORT_COUNT" -eq "0" ]; then
            echo "⚠️ No report files found. Tests may not have generated reports."
            echo "📁 Listing Cypress directory structure..."
            ls -la Cypress/ || echo "Cypress directory not found"
            ls -la Cypress/reports/ 2>/dev/null || echo "Cypress/reports directory not found"
            echo "report_generated=false" >> $GITHUB_OUTPUT
            echo "merged_json_exists=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          node scripts/generate-report.js
          REPORT_EXIT_CODE=$?
          
          if [ $REPORT_EXIT_CODE -eq 0 ]; then
            echo "✅ Report generation completed"
            echo "report_generated=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Report generation failed with exit code $REPORT_EXIT_CODE"
            echo "report_generated=false" >> $GITHUB_OUTPUT
          fi
          
          # Verify merged JSON file exists
          if [ -f "Cypress/reports/merged/mochawesome-merged.json" ]; then
            echo "✅ Merged JSON file exists"
            echo "📊 File size: $(du -h Cypress/reports/merged/mochawesome-merged.json | cut -f1)"
            echo "merged_json_exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Merged JSON file not found at Cypress/reports/merged/mochawesome-merged.json"
            echo "📁 Checking merged directory..."
            ls -la Cypress/reports/merged/ 2>/dev/null || echo "merged directory does not exist"
            echo "merged_json_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: Cypress/reports/merged/test-report.html
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: Cypress/reports/merged/test-summary.md
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Send detailed Slack report
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          CYPRESS_RESULT: ${{ steps.cypress-result.outputs.result }}
          CYPRESS_STATUS: ${{ steps.cypress-result.outputs.status }}
        run: |
          echo "📤 Preparing to send Slack notification..."
          echo "📋 Report generation status: ${{ steps.generate-report.outputs.report_generated }}"
          echo "📋 Merged JSON exists: ${{ steps.generate-report.outputs.merged_json_exists }}"
          
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⚠️ SLACK_WEBHOOK_URL is not set. Skipping Slack notification."
            echo "💡 Make sure SLACK_WEBHOOK_URL is configured in GitHub Secrets"
            exit 0
          fi
          echo "✅ SLACK_WEBHOOK_URL is configured"
          
          # Verify report file exists before sending
          if [ -f "Cypress/reports/merged/mochawesome-merged.json" ]; then
            echo "✅ Found merged report file, sending to Slack..."
          else
            echo "⚠️ Merged report file not found, but will attempt to send notification anyway..."
            echo "📁 Checking for alternative report locations..."
            find . -name "*mochawesome*.json" -type f 2>/dev/null | head -5
          fi
          
          node scripts/slack-notifier.js
          SLACK_EXIT_CODE=$?
          
          if [ $SLACK_EXIT_CODE -ne 0 ]; then
            echo "❌ Slack notification failed with exit code $SLACK_EXIT_CODE"
            echo "📋 Checking script output above for details"
            exit 1
          fi
          echo "✅ Slack notification sent successfully"









          















