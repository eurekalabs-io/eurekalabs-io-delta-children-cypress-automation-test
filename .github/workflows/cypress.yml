name: Automation-Delta-Children Workflow

on:
  # Ejecutar diariamente a las 00:30 UTC (medianoche en muchas zonas horarias)
  schedule:
    - cron: '30 0 * * *'
  # También ejecutar manualmente desde GitHub Actions
  workflow_dispatch:
  # Ejecutar en push a la rama principal
  push:
    branches:
      - Automation-Delta
      - main
      - master

jobs:
  cypress:
    runs-on: ubuntu-latest
    # Sin matriz cuando no hay recording para evitar ejecuciones duplicadas
    strategy:
      fail-fast: false
      matrix:
        containers: [1] # Un solo contenedor (sin paralelización sin recording)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Cypress run (without recording)
        if: ${{ secrets.CYPRESS_RECORD_KEY == '' }}
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'https://www.deltachildren.com/'
          wait-on-timeout: 120
          browser: chrome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cypress run (with recording)
        if: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'https://www.deltachildren.com/'
          wait-on-timeout: 120
          browser: chrome
          record: true
          parallel: true
          group: 'Delta Children Tests'
          ci-build-id: ${{ github.run_id }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: Cypress/screenshots
          retention-days: 7
      
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: Cypress/videos
          retention-days: 7









          















